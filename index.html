<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="국내 ESS 중앙계약시장 입찰조건(약정 방전용량 유지·운전 중 증설 불가)을 반영한 균등화저장비용(LCOS) 계산기. 고려대학교 Energy Innovation Lab.">
<meta property="og:title" content="ESS 균등화저장비용(LCOS) 계산기">
<meta property="og:description" content="국내 ESS 중앙계약시장 입찰조건을 반영한 LCOS 계산기 · 고려대학교 Energy Innovation Lab">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%228%22 width=%2222%22 height=%2216%22 rx=%223%22 fill=%22%239b1c35%22/%3E%3Crect x=%2226%22 y=%2213%22 width=%223%22 height=%226%22 rx=%221%22 fill=%22%239b1c35%22/%3E%3C/svg%3E">
<title>ESS LCOS 계산기 · Energy Innovation Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}
/* Layout: instrument-panel tool. Inputs rail on the left, results stack on the right; one causal strip explains the market rule above. */
:root {
  --bg: #f1f3f6;
  --surface: #ffffff;
  --surface-2: #e8ecf1;
  --line: #d3d9e1;
  --fg: #16202b;
  --muted: #586473;
  --accent: #9b1c35;
  --accent-soft: #f5e5e8;
  --c1: #284a74;
  --c2: #5f87ba;
  --c3: #5f978a;
  --ok-fg: #3b6f63;
  --c4: #cf953a;
  --ink-acc: #ffffff;
  --s1: #2a78d6; --s2: #eb6834; --s3: #0d9488; --s4: #c98500; --s5: #d55181;
  --explore-fg: #855600;
  --explore-bg: #fbefd4;
  --warn-fg: #8a3b12;
  --warn-bg: #fbe6da;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #19202a; --surface-2: #222b36; --line: #2f3a46;
    --fg: #e5eaf0; --muted: #9ba7b4; --accent: #e3657d; --accent-soft: #3a1f27; --ink-acc: #16202b;
    --c1: #6f95c9; --c2: #a6c3e8; --c3: #7fb7a7; --c4: #e3b25a; --ok-fg: #8cc4b4; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --explore-fg: #f1c56d; --explore-bg: #3a2e14; --warn-fg: #f3a37c; --warn-bg: #3d2318;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19202a; --surface-2: #222b36; --line: #2f3a46;
  --fg: #e5eaf0; --muted: #9ba7b4; --accent: #e3657d; --accent-soft: #3a1f27; --ink-acc: #16202b;
  --c1: #6f95c9; --c2: #a6c3e8; --c3: #7fb7a7; --c4: #e3b25a; --ok-fg: #8cc4b4; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --explore-fg: #f1c56d; --explore-bg: #3a2e14; --warn-fg: #f3a37c; --warn-bg: #3d2318;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.55; }
:lang(ko) .lede, :lang(ko) .cap, :lang(ko) .note, :lang(ko) .fnote, :lang(ko) .big-sub, :lang(ko) .m-body p, :lang(ko) .m-body li, :lang(ko) .stat span { word-break: keep-all; }
.foot a { color: inherit; text-decoration: none; }
.head-r { display: grid; gap: 8px; justify-items: end; }
#openFull { font-size: 12.5px; color: var(--accent); font-weight: 500; text-decoration: none; }
#openFull:hover { text-decoration: underline; }
.foot a:hover { text-decoration: underline; }
.mini { display: none; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 40px; display: grid; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* header */
.head { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.head h1 { font-size: clamp(22px, 3.2vw, 30px); font-weight: 700; letter-spacing: -.01em; margin-top: 6px; }
.byline { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; }
.byline b { font-weight: 600; }
.byline a { color: var(--muted); font-family: var(--font-num); font-size: 12.5px; text-decoration: none; border-bottom: 1px solid var(--line); }
.byline a:hover { color: var(--accent); border-color: var(--accent); }
.affil { margin-top: 2px; font-size: 13px; color: var(--muted); }
.lede { margin-top: 10px; max-width: 68ch; color: var(--muted); font-size: 15px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--font-ui); padding: 6px 12px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* rule strip */
.rule { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.rule .step { font-size: 13px; font-weight: 500; background: var(--surface-2); border-radius: 999px; padding: 3px 11px; }
.rule .step.last { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.rule-desc { flex-basis: 100%; font-size: 13px; color: var(--muted); margin-top: 4px; max-width: 120ch; }
:lang(ko) .rule-desc { word-break: keep-all; }
.rule .arrow { color: var(--muted); font-size: 16px; line-height: 1; }
.rule-tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-right: 6px; }

/* main */
.main { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.inputs { padding: 18px; display: grid; gap: 18px; }
.group { display: grid; gap: 10px; }
.group + .group { border-top: 1px solid var(--line); padding-top: 16px; }
.group-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.group-h h2 { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.linkbtn { border: 0; background: none; color: var(--accent); font: 500 12px var(--font-ui); cursor: pointer; padding: 2px 0; }
.linkbtn:hover { text-decoration: underline; }
.techs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.tech { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 8px 6px; font: 500 13px var(--font-ui); cursor: pointer; text-align: center; line-height: 1.25; display: grid; gap: 2px; justify-items: center; }
.tech small { font-size: 10.5px; color: var(--muted); font-weight: 400; }
.tech[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.tech[aria-pressed="true"] small { color: var(--accent); }
.tag-ex { font-size: 10px; font-weight: 600; color: var(--explore-fg); background: var(--explore-bg); border-radius: 4px; padding: 0 5px; }
.field { display: grid; grid-template-columns: 1fr 128px; align-items: center; gap: 8px; }
.field label { font-size: 13px; color: var(--fg); min-width: 0; }
.field label .u { color: var(--muted); font-size: 12px; }
.field.changed label::after { content: " •"; color: var(--accent); }
.field input, .field select { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 6px 8px; font: 13px var(--font-num); text-align: right; font-variant-numeric: tabular-nums; }
.field select { text-align: left; font-family: var(--font-ui); }
.field input:focus, .field select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.field input.bad { border-color: var(--warn-fg); background: var(--warn-bg); }
.basis { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; }
.basis span { grid-column: 1 / -1; }
.basis button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 4px 11px; font: 500 12.5px var(--font-ui); cursor: pointer; min-height: 28px; }
.basis button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.decomp { display: flex; height: 26px; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
.decomp div { height: 100%; display: flex; align-items: center; justify-content: center; font: 500 11.5px var(--font-num); color: #fff; overflow: hidden; white-space: nowrap; }
.decomp-leg { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 4px 16px; font-size: 12.5px; }
.decomp-leg div { display: grid; grid-template-columns: 12px 1fr auto; gap: 6px; align-items: center; }
.decomp-leg i { width: 10px; height: 10px; border-radius: 2px; }
.decomp-leg b { font: 500 12.5px var(--font-num); }
.defs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 18px; font-size: 13px; }
.defs div { background: var(--surface-2); border-radius: 8px; padding: 9px 12px; }
.defs b { display: block; font-size: 13px; margin-bottom: 2px; }
.defs span { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 3px 10px; min-height: 28px; font: 12px var(--font-num); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--fg); color: var(--fg); background: var(--surface-2); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 2px 10px; width: fit-content; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-grid { color: var(--ok-fg); background: var(--surface-2); }
.st-interp { color: var(--c1); background: var(--surface-2); }
.st-out { color: var(--warn-fg); background: var(--warn-bg); }
.st-manual { color: var(--accent); background: var(--accent-soft); }
.note { font-size: 12px; color: var(--muted); }
.note.ex { color: var(--explore-fg); background: var(--explore-bg); border-radius: 6px; padding: 8px 10px; }
details.adv summary { cursor: pointer; font-size: 13px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
details.adv summary::-webkit-details-marker { display: none; }
details.adv summary::after { content: "+"; color: var(--muted); font-weight: 400; }
details.adv[open] summary::after { content: "–"; }
details.adv .group { margin-top: 12px; border-top: 0; padding-top: 0; }
.resetall { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 8px; font: 500 13px var(--font-ui); cursor: pointer; }
.resetall:hover { border-color: var(--fg); }

/* results */
.results { display: grid; gap: 16px; min-width: 0; }
.hero { padding: 20px 22px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: center; }
.big-l { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.big { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
.big .v { font: 500 52px/1 var(--font-num); letter-spacing: -.02em; color: var(--accent); font-variant-numeric: tabular-nums; }
.hero.warn .big .v { color: var(--warn-fg); }
.hero.warn .big-sub { color: var(--warn-fg); font-weight: 500; }
.dim { opacity: .35; filter: grayscale(1); pointer-events: none; }
.tag-ip { font-size: 10px; font-weight: 500; color: var(--muted); background: var(--surface-2); border-radius: 4px; padding: 0 5px; }
.tag-out { font-size: 10px; font-weight: 600; color: var(--warn-fg); background: var(--warn-bg); border-radius: 4px; padding: 0 5px; }
.st-explore { color: var(--explore-fg); background: var(--explore-bg); }
.fnote { font-size: 11.5px; color: var(--explore-fg); margin-top: -4px; }
.big .u { font-size: 15px; color: var(--muted); }
.big-sub { margin-top: 6px; font-size: 13px; color: var(--muted); }
.case-line { margin-top: 4px; font-size: 13px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 18px; }
.stat { display: grid; gap: 1px; min-width: 0; border-left: 1px solid var(--line); padding-left: 12px; }
.stat span { font-size: 12px; color: var(--muted); }
.stat b { font: 500 17px var(--font-num); font-variant-numeric: tabular-nums; }
.stat b small { font: 12px var(--font-ui); color: var(--muted); margin-left: 2px; }
.card { padding: 18px 20px; display: grid; gap: 12px; min-width: 0; }
.card h3 { font-size: 15px; font-weight: 600; }
.card .cap { font-size: 13px; color: var(--muted); max-width: 70ch; }
.two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.parts { max-width: 560px; }
svg text { font-family: var(--font-ui); }
.ax { stroke: var(--line); stroke-width: 1; }
.grid-l { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.tick { fill: var(--muted); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px); }
.stack { display: flex; height: 22px; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
.stack div { height: 100%; }
.parts { display: grid; gap: 6px; }
.part { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; font-size: 13px; }
.part .sw { width: 10px; height: 10px; border-radius: 2px; }
.part .pv { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
.part .pp { font-family: var(--font-num); color: var(--muted); font-size: 12px; width: 44px; text-align: right; }
.part-h { font-size: 11.5px; color: var(--muted); }
.part-h .pv, .part-h .pp { font-family: var(--font-ui); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.field input:disabled { opacity: .55; }
.cmp { display: grid; gap: 7px; }
.cmp-row { display: grid; grid-template-columns: 250px minmax(0, 1fr) 62px; gap: 8px; align-items: center; font-size: 12.5px; }
.cmp-row .nm { display: flex; gap: 4px; align-items: center; min-width: 0; }
.cmp-row .bar { height: 14px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.cmp-row .bar div { height: 100%; background: var(--c2); }
.cmp-row.sel .bar div { background: var(--accent); }
.cmp-row.sel .nm { font-weight: 600; color: var(--accent); }
.cmp-head { font-size: 11.5px; color: var(--muted); }
.cmp-head .val { font-family: var(--font-ui); white-space: nowrap; }
.sen { display: grid; gap: 6px; }
.sen-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 58px 58px; gap: 10px; align-items: center; font-size: 12.5px; }
.sen-head { font-size: 11.5px; color: var(--muted); }
.sen-axis { display: flex; justify-content: space-between; gap: 6px; }
.sen-axis span:nth-child(2) { color: var(--fg); font-weight: 500; }
.sbar { position: relative; height: 18px; background: var(--surface-2); border-radius: 3px; }
.sbar .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--fg); opacity: .5; }
.tb { position: absolute; height: 7px; border-radius: 2px; }
.tb.lo { top: 2px; background: var(--s1); }
.tb.hi { bottom: 2px; background: var(--s2); }
.sv { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
.sen-head .sv { font-family: var(--font-ui); }
.chart-wrap { position: relative; }
.tip { position: absolute; top: 8px; min-width: 170px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); pointer-events: none; display: grid; gap: 3px; }
.tip b { font-weight: 600; margin-bottom: 2px; }
.tip div { display: grid; grid-template-columns: 12px 1fr auto; gap: 6px; align-items: center; }
.tip .tv { margin-left: 8px; }
.tip i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.tip .tv { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.tip em.tag-ex { font-style: normal; }
.chart-lab { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.cmp-row .od { font-size: 11px; color: var(--muted); font-weight: 400; font-family: var(--font-num); white-space: nowrap; }
.cmp-row .val { font-family: var(--font-num); text-align: right; font-variant-numeric: tabular-nums; }
.cmp-row.na .val, .cmp-row.na .nm { color: var(--muted); }

/* method */
.method { padding: 4px 20px; }
.method > summary { cursor: pointer; padding: 14px 0; font-size: 15px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
.method > summary::-webkit-details-marker { display: none; }
.method > summary::after { content: "+"; color: var(--muted); font-weight: 400; }
.method[open] > summary::after { content: "–"; }
.m-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 28px; padding-bottom: 20px; }
.m-body h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.m-body p, .m-body li { font-size: 13px; color: var(--muted); }
.m-body ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.eq { font-family: var(--font-num); font-size: 12.5px; background: var(--surface-2); border-radius: 6px; padding: 10px 12px; line-height: 1.8; overflow-x: auto; white-space: nowrap; color: var(--fg); }
.ptable-wrap { overflow-x: auto; }
table.pt { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.pt th, table.pt td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.pt th:first-child, table.pt td:first-child { text-align: left; }
table.pt th { color: var(--muted); font-weight: 500; }
table.pt td { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
table.pt td:first-child { font-family: var(--font-ui); }
.foot { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

@media (max-width: 1120px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 14px; }
}
@media (max-width: 900px) and (min-width: 761px) {
  .main { grid-template-columns: 300px minmax(0, 1fr); gap: 16px; }
  .inputs { padding: 14px; }
  .field { grid-template-columns: 1fr 108px; }
  .hero { grid-template-columns: minmax(0, 1fr); gap: 14px; }
}
@media (max-width: 900px) {
  .two, .m-body, .defs { grid-template-columns: minmax(0, 1fr); }
  .cmp-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'nm val' 'bar bar'; row-gap: 3px; }
  .cmp-row .nm { grid-area: nm; } .cmp-row .val { grid-area: val; } .cmp-row .bar { grid-area: bar; }
  .cmp-head span:nth-child(2) { display: none; }
  .sen-row { grid-template-columns: minmax(0, 1fr) 50px 50px; grid-template-areas: 'sl sl sl' 'sb lo hi'; gap: 2px 8px; font-size: 12px; }
  .sen-row .sl { grid-area: sl; } .sen-row .sbar { grid-area: sb; } .sen-row .slo { grid-area: lo; } .sen-row .shi { grid-area: hi; }
  .sen-head { grid-template-areas: 'sb lo hi'; } .sen-head > span:first-child { display: none; } .sen-head .sen-axis { grid-area: sb; }
  .sen-axis span:first-child, .sen-axis span:last-child { display: none; }
  .sen-axis { justify-content: center; }
}
@media (max-width: 760px) {
  .mini { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }

    mT: '계산 방법과 자료',
    ptNote: '비용은 리튬이온·소듐이온 100MW·명목 8h, 양수발전 500MW·7h 기준입니다. 리튬이온·양수발전 파라미터는 안재균·임덕오(2025, Schmidt et al., 2019 기반), 소듐이온 파라미터는 제조사 공개 자료와 LFP·NCM 준용값입니다. 사이클당 열화율은 사이클 수명과 말기 용량 80%에서 계산한 값입니다. 실질 할인율 8%, 충전전력단가 0원/kWh가 기본 조건입니다.',
    method: `
      <div><h4>LCOS 정의</h4>
      <div class="eq">LCOS = [CAPEX + Σ<sub>n</sub> (OPEX + P<sub>elec</sub>·E<sub>ch</sub>) / (1+r)<sup>n</sup>] ÷ Σ<sub>n</sub> E<sub>dis</sub> / (1+r)<sup>n</sup><br>n = T<sub>c</sub>+1 … T<sub>c</sub>+N,&nbsp; CAPEX = C<sub>P</sub>·P + C<sub>E</sub>·P·t<sub>nom</sub><br>E<sub>dis</sub> = P · t<sub>eff</sub> · cycles (매년 동일),&nbsp; E<sub>ch</sub> = E<sub>dis</sub>/η + P·t<sub>nom</sub>·σ·365</div>
      <p style="margin-top:8px">투자비는 착공 시점에 한 번 발생하고, 운영비·충전비·방전량은 건설기간 이후 사업기간(상업운전 기간) 동안 할인합니다. 계약기간 내내 같은 계통 서비스를 제공한다는 계통운영자 관점에서 연간 방전량을 고정합니다. 사이클 수를 고정하고 방전량이 줄어드는 일반적인 LCOS(Schmidt et al., 2019)와 다른 점입니다.</p></div>
      <div><h4>오버사이징과 실효 방전시간</h4>
      <div class="eq">N (사업기간) = ⌊min(캘린더 수명, 사이클 수명 / 연간 운용횟수)⌋<br>δ = 1 − SOH<sub>cyc</sub><sup>1/사이클수명</sup>,&nbsp; SOH<sub>end</sub> = (1−δ)<sup>cycles·N</sup><br>DoD<sub>end</sub> = DoD̄ · ln(1/SOH<sub>end</sub>) / (1 − SOH<sub>end</sub>)<br>t<sub>eff</sub> = t<sub>nom</sub> · SOH<sub>end</sub> · DoD<sub>end</sub> · √η &nbsp;(양수: t<sub>eff</sub> = t<sub>nom</sub>)</div>
      <p style="margin-top:8px">비용은 명목 설치용량(P·t<sub>nom</sub>)에, 방전량은 운전 말기에도 낼 수 있는 실효 방전시간에 연동됩니다. 열화가 지수적으로 진행한다고 보고, 생애주기 평균 DoD가 입력한 평균 DoD(기본 80%, 사이클 수명 시험조건)와 같아지도록 말기 DoD를 산정합니다. 사이클당 열화율 δ는 사이클 수명과 그 시점의 말기 용량(80%)에서 정해집니다(예: LFP 9,000회 → 0.002479%/회). 방전효율은 왕복효율의 제곱근으로 둡니다. 양수발전의 명목 방전시간은 실제 연속발전시간이므로 줄이지 않습니다.</p>

/* ---------- LCOS engine ---------- */
function computeLCOS(x) {
  const deg = 1 - Math.pow(x.sohC, 1 / x.lifeC);
  const nOp = x.nFix > 0 ? x.nFix : Math.floor(Math.min(x.lifeY, x.lifeC / x.cyc));
  const sohP = Math.pow(1 - deg, x.cyc * nOp);
  let eolDod;
  if (x.pumped) eolDod = 1;
  else if (Math.abs(1 - sohP) < 1e-9) eolDod = x.dod;
  else eolDod = x.dod * Math.log(1 / sohP) / (1 - sohP);
  const dEff = x.pumped ? x.dNom : x.dNom * sohP * eolDod * Math.sqrt(x.eta);
  const eCap = x.P * x.dNom;
  const eDis = x.P * dEff * x.cyc;
  const eCh = eDis / x.eta + eCap * x.self * 365;
  const capexP = x.P * x.cp, capexE = eCap * x.ce;
  const opex = x.P * x.om;
  const nProj = nOp + x.tc;
  let pvE = 0, pvOM = 0, pvEl = 0;

function drawOversize(R, x) {

  xt.forEach(k => { s += `<text class="tick" x="${X(k)}" y="${H - B + 16}" text-anchor="middle">${k}</text>`; });
  s += `<line class="ax" x1="${L}" x2="${W - Rm}" y1="${Y(0)}" y2="${Y(0)}"/>`;

    : T('ovCapB')(fmtMWh(nom), fmtMWh(fix), n, fmt(R.sohP * 100, 1), fmt(R.eolDod * 100, 1), fmt(Math.sqrt(x.eta) * 100, 1));

function niceMax(v) { const p = 10 ** Math.floor(Math.log10(v)); const m = v / p; const st = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 7.5, 10].find(s => m <= s + 1e-9); return st * p; }

function drawCompare(Rsel, selStatus) {

/* ---------- sensitivity (tornado) ---------- */
const SER = { LFP: '--s1', NCM: '--s2', PSH: '--s3', NMF: '--s4', NFPP: '--s5' };
function physOK(x, R) { return !(!x.pumped && R.eolDod > 1 + 1e-9) && R.dEff * x.cyc * (1 + 1 / x.eta) <= 8760 && R.nOp >= 1; }
function drawSensitivity(R, x) {
  const items = [['cp', 'lCP'], ['ce', 'lCE'], ['om', 'lOM'], ['r', 'lR'], ['cyc', 'lCyc'], ['eta', 'lEta'], ['lifeC', 'lLifeC'], ['lifeY', 'lLifeY']];
  if (x.pel > 0) items.push(['pel', 'lPel']);
  const base = R.lcos;
  const rows = [];
  items.forEach(([k, lab]) => {
    const out = [0.8, 1.2].map(f => {
      let y = { ...x };
      if (['cyc', 'eta', 'lifeC', 'lifeY', 'contract'].includes(k)) {
        const p2 = { ...S.p }; let cyc2 = curCyc(); let nF;
        if (k === 'cyc') cyc2 = x.cyc * f; else if (k === 'eta') p2.eta = Math.min(100, S.p.eta * f); else if (k === 'contract') nF = Math.max(1, Math.round(S.contract * f)); else p2[k] = S.p[k] * f;
        if (k === 'eta' && p2.eta === S.p.eta) return { v: base, same: true };
        const b = buildX(S.tech, p2, { cyc: cyc2, cost: S.cost, man: TECH[S.tech].custom ? { cp: true, ce: true, om: true } : S.man, pumped: S.pumped, nFix: nF });
        if (b.auto && b.status === 'out' && !COSTS.every(c => S.man[c])) return null;
        y = b.x;
        if (![y.dNom, y.cp, y.ce, y.om].every(isFinite)) return null;
      } else {
        y[k] = x[k] * f;
      }
      const Ry = computeLCOS(y);
      return physOK(y, Ry) && isFinite(Ry.lcos) ? { v: Ry.lcos } : null;
    });
    const span = Math.max(...out.map(o => o ? Math.abs(o.v - base) : 0));
    if (span >= 0.05) rows.push({ lab: T(lab), lo: out[0], hi: out[1], span });
  });
  rows.sort((a, b) => b.span - a.span);
  const m = Math.max(...rows.map(r => r.span), 1e-9);
  const bar = (o, cls) => {
    if (!o) return '';
    const d = o.v - base, w = Math.abs(d) / m * 50, l = d < 0 ? 50 - w : 50;
    return `<div class="tb ${cls}" style="left:${l}%;width:${w}%"></div>`;
  };
  const val = o => o ? fmt(o.v, 1) : '–';
  const L = S.lang === 'ko';
  $('sen').innerHTML = `<div class="sen-row sen-head"><span></span><span class="sen-axis"><span>${L ? '← LCOS 낮아짐' : '← LCOS lower'}</span><span>${T('senBase')(fmt(base, 1))} ${T('uKWh')}</span><span>${L ? 'LCOS 높아짐 →' : 'LCOS higher →'}</span></span><span class="sv slo">−20%</span><span class="sv shi">+20%</span></div>` +
    rows.map(r => `<div class="sen-row" title="${r.lab}: −20% → ${val(r.lo)}, +20% → ${val(r.hi)} ${T('uKWh')}">
      <span class="sl">${r.lab}</span>
      <span class="sbar"><span class="mid"></span>${bar(r.lo, 'lo')}${bar(r.hi, 'hi')}</span>
      <span class="sv slo">${val(r.lo)}</span><span class="sv shi">${val(r.hi)}</span></div>`).join('') +
    `<div class="legend" style="margin-top:4px"><span><i style="background:var(--s1)"></i>${L ? '입력값 −20%' : 'Input −20%'}</span><span><i style="background:var(--s2)"></i>${L ? '입력값 +20%' : 'Input +20%'}</span><span>${L ? '오른쪽 숫자: 해당 LCOS(원/kWh)' : 'Numbers: resulting LCOS (KRW/kWh)'}</span></div>`;
}

/* ---------- LCOS by duration ---------- */
const DURS = [2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 14, 16, 18, 20, 22, 24];
function refInputs(k, d) {
  const t = TECH[k];

}
let durData = null;

    .filter(s => s.pts.some(p => p));

    durData = null; $('durTip').hidden = true;

  if (showNow) vals.push(R.lcos);
  const ymax = niceMax(Math.max(...vals) * 1.05);
  const X = d => Lm + (W - Lm - Rm) * (d - 2) / 22, Y = v => Tp + (H - Tp - B) * (1 - v / ymax);
  let s = '';
  ticks(ymax).forEach(v => { s += `<line class="grid-l" x1="${Lm}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${Lm - 8}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; });
  const xt = W < 480 ? [2, 6, 10, 16, 24] : [2, 4, 6, 8, 10, 12, 16, 20, 24];
  xt.forEach(d => { s += `<text class="tick" x="${X(d)}" y="${H - B + 16}" text-anchor="middle">${d}</text>`; });
  s += `<line class="ax" x1="${Lm}" x2="${W - Rm}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  s += `<text class="tick" x="${(Lm + W - Rm) / 2}" y="${H - 4}" text-anchor="middle">${T(S.basis === 'eff' ? 'axDurE' : 'axDur')}</text>`;

  s += `<line id="durX" class="ax" x1="0" x2="0" y1="${Tp}" y2="${Y(0)}" style="visibility:hidden;stroke:var(--muted)"/>`;
  s += `<rect x="${Lm}" y="${Tp}" width="${W - Lm - Rm}" height="${H - Tp - B}" style="fill:transparent" id="durHit"/>`;

  $('durLegend').innerHTML = series.map(se => `<span><i style="background:var(${SER[se.k]})${TECH[se.k].explore ? ';background:repeating-linear-gradient(90deg,var(' + SER[se.k] + ') 0 5px,transparent 5px 8px)' : ''}"></i>${T('names')[se.k]}${TECH[se.k].explore ? ' (' + T('explore') + ')' : ''}</span>`).join('') +
    (showNow ? `<span><i style="width:9px;height:9px;border-radius:50%;border:2px solid var(--fg);background:var(--surface)"></i>${T('durNow')}</span>` : '');
}
function bindDurHover() {
  const svg = $('durChart'), tip = $('durTip');
  const hide = () => { tip.hidden = true; const l = $('durX'); if (l) l.style.visibility = 'hidden'; };
  const show = e => {
    if (!durData) return;
    const rect = svg.getBoundingClientRect();
    const vx = (e.clientX - rect.left) / rect.width * durData.W;
    if (vx < durData.Lm - 6 || vx > durData.W - durData.Rm + 6) { hide(); return; }
    let best = DURS[0]; DURS.forEach(d => { if (Math.abs(durData.X(d) - vx) < Math.abs(durData.X(best) - vx)) best = d; });
    const i = DURS.indexOf(best);
    const lines = durData.series.map(se => ({ k: se.k, p: se.pts[i] })).filter(o => o.p).sort((a, b) => a.p.v - b.p.v);
    if (!lines.length) { hide(); return; }
    const l = $('durX'); l.setAttribute('x1', durData.X(best)); l.setAttribute('x2', durData.X(best)); l.style.visibility = 'visible';
    tip.innerHTML = `<b>${T(S.basis === 'eff' ? 'effS' : 'nomS')} ${best} h · ${T('uKWh')}</b>` +
      lines.map(o => `<div><i style="background:var(${SER[o.k]})"></i><span class="tn">${T('names')[o.k]}${TECH[o.k].explore ? ' <em class="tag-ex">' + T('explore') + '</em>' : ''}</span><span class="tv">${fmt(o.p.v, 1)}</span></div>`).join('');
    tip.hidden = false;
    const px = durData.X(best) / durData.W * rect.width, tw = tip.offsetWidth;
    tip.style.left = (px + 12 + tw > rect.width ? Math.max(0, px - tw - 12) : px + 12) + 'px';
  };
  svg.addEventListener('pointermove', show);
